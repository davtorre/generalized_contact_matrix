[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-contact-matrix"
version = "0.1.0"
description = "Generalized contact matrices: contacts between demographic groups defined by any combination of features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "polars"]

[tool.setuptools.packages.find]
where = ["src"]
